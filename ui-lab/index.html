<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>许愿特化器 · 优化选项面板 · 14 版设计预览</title>
<style>
:root{--bg:#0b0c0e;--surface:#16181b;--surface2:#1c1f23;--chip:#22262b;--line:#2c3037;--line2:#23262b;--fg:#eceef2;--fg2:#b7bdc7;--fg3:#7d858f;--acc:#6ea8fe;--accFg:#0b1220;--danger:#f2777a;--ok:#3ecf8e;--r:12px;--sh:0 22px 60px -26px rgba(0,0,0,.85)}
body.light{--bg:#eeeeea;--surface:#fff;--surface2:#f6f6f2;--chip:#e9e9e3;--line:#d8d8d1;--line2:#e6e6df;--fg:#191b1e;--fg2:#464b53;--fg3:#7a8088;--acc:#2f6fed;--accFg:#fff;--danger:#c0342b;--ok:#1f8f57;--sh:0 22px 50px -28px rgba(24,30,44,.30)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 Inter,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
header h1{margin:0;font-size:12.5px;font-weight:650;letter-spacing:.01em}
header .hint{color:var(--fg3);font-size:11.5px}
header .grow{flex:1}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--fg2);border-radius:8px;padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer;transition:.14s}
.tbtn:hover{background:var(--chip);color:var(--fg)}
.tbtn[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accFg)}
.wrap{display:grid;grid-template-columns:196px minmax(0,1fr);gap:20px;padding:18px 20px 60px;align-items:start}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:baseline;gap:8px;width:100%;padding:7px 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--fg3);font:inherit;font-size:12px;text-align:left;cursor:pointer;transition:.12s}
.rail button b{font-weight:600;font-size:10px;min-width:16px;color:var(--fg3)}
.rail button[aria-current=true]{background:var(--chip);border-color:var(--line2);color:var(--fg)}
.rail button:hover{color:var(--fg)}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.meta{width:100%;max-width:560px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 2px}
.meta h2{margin:0;font-size:13px;font-weight:650}
.meta p{margin:0;color:var(--fg3);font-size:11.5px}
.frame{width:100%;max-width:560px}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;animation:pop .18s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
.pad{padding:16px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2)}
.hd strong{font-size:12.5px;font-weight:600;color:var(--fg2)}
.x{border:0;background:transparent;color:var(--fg3);font-size:17px;line-height:1;cursor:pointer;border-radius:6px;width:24px;height:24px;transition:.12s}
.x:hover{background:var(--chip);color:var(--fg)}
.kicker{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.muted{color:var(--fg3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line2);border-radius:8px;background:var(--chip)}
.seg button{min-height:24px;padding:2px 9px;border:0;border-radius:6px;background:transparent;color:var(--fg3);font:inherit;font-size:11.5px;cursor:pointer;transition:.13s}
.seg button:hover{color:var(--fg)}
.seg button[aria-checked=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:600}
.seg button:disabled{cursor:not-allowed;opacity:.4}
.sw{position:relative;width:26px;height:15px;flex:0 0 26px;border:1px solid var(--line);border-radius:9px;transition:.14s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--fg3);transition:.14s}
[aria-checked=true] .sw{background:var(--acc);border-color:var(--acc)}
[aria-checked=true] .sw:after{transform:translateX(11px);background:var(--surface)}
.swline{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:7px 0;border:0;border-bottom:1px solid var(--line2);background:transparent;font:inherit;font-size:12px;text-align:left;cursor:pointer;color:var(--fg)}
.swline:last-child{border-bottom:0}
.swline small{display:block;color:var(--fg3);font-size:10.5px;font-weight:400}
.swline:disabled{opacity:.45;cursor:not-allowed}
.tiers{display:grid;margin-top:10px}
.tiers button{border:0;background:transparent;color:var(--fg3);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.tiers.axis{grid-template-columns:repeat(4,1fr);position:relative;padding-top:3px}
.tiers.axis:before{content:"";position:absolute;left:4px;right:4px;top:6px;height:1px;background:var(--line)}
.tiers.axis button{display:flex;flex-direction:column;gap:8px;padding:0 6px 0 0}
.tiers.axis button:before{content:"";width:7px;height:7px;border:1px solid var(--line);border-radius:50%;background:var(--surface);transition:.15s}
.tiers.axis button[aria-checked=true]{color:var(--fg);font-weight:600}
.tiers.axis button[aria-checked=true]:before{background:var(--acc);border-color:var(--acc);transform:scale(1.35)}
.tiers.stack{grid-template-columns:1fr}
.tiers.stack button{display:flex;justify-content:space-between;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line2);transition:.13s}
.tiers.stack button[aria-checked=true]{color:var(--fg);font-weight:600;box-shadow:inset 2px 0 0 var(--acc);padding-left:10px}
.tiers.chips{grid-template-columns:repeat(4,1fr);gap:6px}
.tiers.chips button{padding:8px 6px;border:1px solid var(--line2);border-radius:8px;text-align:center;background:var(--surface2)}
.tiers.chips button[aria-checked=true]{border-color:var(--acc);color:var(--fg);background:var(--accSoft,var(--chip))}
.pick{position:relative}
.pick>button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:28px;padding:3px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--chip);color:var(--fg2);font:inherit;font-size:11.5px;cursor:pointer}
.pick>button:hover{border-color:var(--line)}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:5;min-width:150px;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--sh);animation:pop .12s ease-out both}
.menu button{display:block;width:100%;padding:6px 8px;border:0;border-radius:6px;background:transparent;color:var(--fg2);font:inherit;font-size:11.5px;text-align:left;cursor:pointer}
.menu button:hover{background:var(--chip);color:var(--fg)}
.menu button[aria-selected=true]{color:var(--acc);background:var(--chip)}
input[type=range]{width:100%;accent-color:var(--acc)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;border-top:1px solid var(--line2);color:var(--fg3);font-size:10.5px}
.detail{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--fg3);font:inherit;font-size:11px;cursor:pointer;padding:0}
.detail:hover{color:var(--fg)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.save{font-size:10.5px;color:var(--fg3)}
.save[data-s=error]{color:var(--danger)}
.save[data-s=saved]{color:var(--fg3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{padding:12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface2)}
.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
.mini{transform:scale(.62);transform-origin:top left;width:161%}
.minilabel{font-size:11px;color:var(--fg3);margin-bottom:6px}
</style></head><body>
<header><h1>许愿特化器 · 优化选项</h1><span class="hint" id="hint">14 版 · 数字键 1–9 / 0 切换· 全部控件都在</span><span class="grow"></span>
<button class="tbtn" id="errors" title="预览保存失败状态">保存失败预览</button>
<button class="tbtn" id="overviewBtn" aria-pressed="false">并排总览</button>
<button class="tbtn" id="theme">切换深浅</button></header>
<div class="wrap"><nav class="rail" id="rail"></nav><main class="stage" id="stage"><div class="meta"><h2 id="vname"></h2><p id="vnote"></p></div><div class="frame" id="frame"></div></main></div>
<script>
const S={tier:'heavy',state:'extreme',advisor:true,english:false,permission:'auto',model:'follow',effort:'max',mode:'turns',turns:6,readTools:true,bash:true,doubleEnter:true,menu:null,tierOpen:null,section:'intensity',step:0,save:'idle',fail:false}
const TIERS=[['off','关闭'],['light','轻度'],['standard','标准'],['heavy','重度']]
const MODELS=[['follow','跟随会话模型'],['v31','DeepSeek V3.1'],['r1','DeepSeek R1']]
const EFFORTS=[['max','Max'],['high','High'],['off','Off']]
const tierName=()=>(TIERS.find(t=>t[0]===S.tier)||[,'重度'])[1]
const label=(list,key)=>(list.find(x=>x[0]===key)||list[0])[1]
const disabled=()=>S.tier==='off'&&!S.english
const V=[
 ['刻度轴','强度落在一条轴上，其余收进索引','axis'],
 ['分区台','左侧分区索引，右侧一次一屏','desk'],
 ['命令面板','搜索 + 列表，键盘优先','palette'],
 ['手风琴','单列展开，留白与字号呼吸','accordion'],
 ['拼贴网格','Bento 卡片，设置各自成块','bento'],
 ['旋钮','可拖动强度环，物理感','dial'],
 ['底部抽屉','移动优先，上滑大圆角','sheet'],
 ['分屏预览','左调右看，实时注入摘要','split'],
 ['三步向导','强度→模型→行为，一次一问','stepper'],
 ['排版纸面','杂志双栏，悬挂大字','editorial'],
 ['图标栏','窄图标轨 + 单列内容','icontab'],
 ['卡片翻页','一次一张设置卡，圆点分页','deck'],
 ['双列紧凑','专业密度，两列并排','dense'],
 ['单行内联','一行一项，控件内联在右侧','inline'],
]
const rail=document.getElementById('rail'),frame=document.getElementById('frame')
let cur=0,overview=false
rail.innerHTML=V.map((v,i)=>'<button data-i="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b>'+v[0]+'</button>').join('')
rail.onclick=e=>{const b=e.target.closest('button');if(b){overview=false;show(+b.dataset.i)}}
document.getElementById('theme').onclick=()=>document.body.classList.toggle('light')
document.getElementById('overviewBtn').onclick=e=>{overview=!overview;e.currentTarget.setAttribute('aria-pressed',overview);render()}
document.getElementById('errors').onclick=e=>{S.fail=!S.fail;S.save=S.fail?'error':'idle';e.currentTarget.setAttribute('aria-pressed',S.fail);render()}
addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){overview=false;show((+e.key+13)%14)}})
function act(a,v){if(a==='tier')S.tier=v;else if(a==='state')S.state=v;else if(a==='permission')S.permission=v;else if(a==='mode')S.mode=v
 else if(a==='step')S.step=+v;else if(a==='sec')S.section=v;else if(a==='menu')S.menu=S.menu===v?null:v
 else if(a==='pick'){S[v.split(':')[0]]=v.split(':')[1];S.menu=null}
 else if(a==='toggle'){if(v in {readTools:1,bash:1,english:1})S[v]=!S[v];else S[v]=!S[v]}
 else if(a==='next')S.step=Math.min(2,S.step+1);else if(a==='prev')S.step=Math.max(0,S.step-1)
 else if(a==='detail')S.menu=null
 if(!S.fail)S.save='saving'
 render();if(!S.fail)setTimeout(()=>{if(!S.fail){S.save='saved';render()}},420)}
function saveState(){return '<span class="save" data-s="'+S.save+'">'+(S.fail?'保存失败 · 重试':'自动保存')+'</span>'}
/* ---- shared controls: every version composes these ---- */
const tier=(kind='axis')=>'<div class="tiers '+kind+'">'+TIERS.map(([k,l])=>'<button data-a="tier" data-v="'+k+'" aria-checked="'+(S.tier===k)+'">'+l+'</button>').join('')+'</div>'
const seg=(key,list,dis)=>'<div class="seg" role="radiogroup">'+list.map(([k,l])=>'<button role="radio" data-a="'+key+'" data-v="'+k+'" aria-checked="'+(({state:S.state,permission:S.permission,mode:S.mode})[key]===k)+'"'+(dis?' disabled':'')+'>'+l+'</button>').join('')+'</div>'
const sw=(key,on,sub,dis)=>'<button class="swline" data-a="toggle" data-v="'+key+'" aria-checked="'+!!on+'"'+(dis?' disabled':'')+'><span>'+on_label(key)+(sub?'<small>'+sub+'</small>':'')+'</span><span class="sw"></span></button>'
function on_label(k){return {advisor:'顾问',english:'英文模式',readTools:'只读工具',bash:'内置 Bash',doubleEnter:'双击 Enter 跳过'}[k]||k}
const pick=(key,list,labelText)=>'<div class="pick"><button data-a="menu" data-v="'+key+'">'+labelText+'<span aria-hidden="true">▾</span></button>'+(S.menu===key?'<div class="menu">'+list.map(([k,l])=>'<button data-a="pick" data-v="'+key+':'+k+'" aria-selected="'+(({model:S.model,effort:S.effort})[key]===k)+'">'+l+'</button>').join('')+'</div>':'')+'</div>'
const slider=()=>'<div><div class="row" style="font-size:11.5px;color:var(--fg3)"><span>回合数</span><b style="color:var(--fg)">'+S.turns+'</b></div><input type="range" min="0" max="10" value="'+S.turns+'" data-a="turns"></div>'
const detail=()=>'<button class="detail" data-a="detail"><span class="dot"></span>详情 ↗</button>'
const head=(t)=>'<div class="hd"><strong>'+(t||'优化选项')+'</strong><button class="x" data-a="detail">×</button></div>'
const foot=()=>'<div class="foot">'+detail()+saveState()+'</div>'
const all=(kind)=>tier(kind)+'<div class="row" style="margin-top:12px;font-size:11.5px;color:var(--fg3)"><span>模型状态</span>'+seg('state',[['normal','正常'],['extreme','极限']])+'</div>'
/* ---- 14 compositions: each renders EVERY control ---- */
const R={
 axis:()=>'<div class="panel">'+head()+'<div class="pad"><p class="kicker">优化强度</p><p style="margin:6px 0 0;font-size:38px;line-height:1;font-weight:650;letter-spacing:-.045em">'+tierName()+'</p><p class="muted" style="margin:8px 0 0;font-size:11.5px;max-width:34ch">深入展开，让想法走得更远。</p>'+all('axis')+'<div class="grid2" style="margin-top:14px">'+sw('advisor',S.advisor)+sw('english',S.english)+'</div><div style="margin-top:12px;border-top:1px solid var(--line2);padding-top:10px"><div class="row" style="font-size:11.5px;color:var(--fg3)"><span>权限</span>'+seg('permission',[['review','审查'],['auto','自动']],disabled())+'</div><div class="row" style="margin-top:10px;font-size:11.5px;color:var(--fg3)"><span>模型</span><div style="width:170px">'+pick('model',MODELS,label(MODELS,S.model))+'</div></div><div class="row" style="margin-top:10px;font-size:11.5px;color:var(--fg3)"><span>思考档位</span><div style="width:120px">'+pick('effort',EFFORTS,label(EFFORTS,S.effort))+'</div></div><div class="row" style="margin-top:10px;font-size:11.5px;color:var(--fg3)"><span>上下文</span>'+seg('mode',[['turns','回合'],['full','全文']],disabled())+'</div><div style="margin-top:10px">'+(S.mode==='turns'?slider():'<p class="muted" style="font-size:11px">读入当前保留的全部回合。</p>')+'</div></div><div style="margin-top:6px">'+sw('readTools',S.readTools)+sw('bash',S.bash)+sw('doubleEnter',S.doubleEnter)+'</div></div>'+foot()+'</div>',
 desk:()=>{const nav=[['intensity','强度',tierName()],['model','模型',label([['review','审查'],['auto','自动']],S.permission)],['context','上下文',S.mode==='full'?'全文':S.turns+' 回合'],['tools','行为',[S.advisor,S.english,S.readTools,S.bash,S.doubleEnter].filter(Boolean).length+' / 5']]
  const pane=S.section==='intensity'?('<p class="kicker">优化强度</p><p style="margin:4px 0 0;font-size:30px;font-weight:650;letter-spacing:-.03em">'+tierName()+'</p>'+tier('stack')+'<div class="row" style="margin-top:12px;font-size:11.5px;color:var(--fg3)"><span>模型状态</span>'+seg('state',[['normal','正常'],['extreme','极限']])+'</div>')
   :S.section==='model'?('<div class="row" style="font-size:11.5px;color:var(--fg3)"><span>权限</span>'+seg('permission',[['review','审查'],['auto','自动']],disabled())+'</div><div class="row" style="margin-top:12px;font-size:11.5px;color:var(--fg3)"><span>模型</span><div style="width:168px">'+pick('model',MODELS,label(MODELS,S.model))+'</div></div><div class="row" style="margin-top:12px;font-size:11.5px;color:var(--fg3)"><span>思考档位</span><div style="width:120px">'+pick('effort',EFFORTS,label(EFFORTS,S.effort))+'</div></div>')
   :S.section==='context'?('<div class="row" style="font-size:11.5px;color:var(--fg3)"><span>读取范围</span>'+seg('mode',[['turns','回合'],['full','全文']],disabled())+'</div><div style="margin-top:12px">'+(S.mode==='turns'?slider():'<p class="muted" style="font-size:11px">读入全部回合。</p>')+'</div>')
   :(sw('advisor',S.advisor)+sw('english',S.english)+sw('readTools',S.readTools)+sw('bash',S.bash)+sw('doubleEnter',S.doubleEnter))
  return '<div class="panel">'+head()+'<div style="display:grid;grid-template-columns:118px minmax(0,1fr)"><nav style="padding:9px 7px;border-right:1px solid var(--line2)">'+nav.map(([id,l,m])=>'<button class="desk-tab" data-a="sec" data-v="'+id+'" aria-current="'+(S.section===id)+'" style="display:flex;flex-direction:column;gap:1px;width:100%;padding:7px 8px;border:0;border-radius:7px;background:'+(S.section===id?'var(--chip)':'transparent')+';color:'+(S.section===id?'var(--fg)':'var(--fg3)')+';font:inherit;font-size:12px;text-align:left;cursor:pointer"><span style="font-weight:'+(S.section===id?600:400)+'">'+l+'</span><small style="font-size:10px">'+m+'</small></button>').join('')+'</nav><div class="pad" style="animation:slide .16s ease-out both;min-height:250px">'+pane+'</div></div>'+foot()+'</div>'},
 palette:()=>'<div class="panel"><div style="padding:12px 14px;border-bottom:1px solid var(--line2)"><input placeholder="搜索设置…" style="width:100%;border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;outline:none"></div>'+[['强度',tierName(),'tier'],['模型状态',S.state==='extreme'?'极限':'正常','state'],['权限',label([['review','审查'],['auto','自动']],S.permission),'permission'],['模型',label(MODELS,S.model),'model'],['思考档位',label(EFFORTS,S.effort),'effort'],['上下文',S.mode==='full'?'全文':S.turns+' 回合','mode'],['顾问',S.advisor?'开':'关','advisor'],['英文模式',S.english?'开':'关','english'],['只读工具',S.readTools?'开':'关','readTools'],['内置 Bash',S.bash?'开':'关','bash'],['双击 Enter 跳过',S.doubleEnter?'开':'关','doubleEnter']].map(([k,v,key],i)=>'<div style="padding:0 14px"><div class="row" style="padding:9px 0;font-size:12px;'+(i===0?'background:var(--chip);margin:0 -14px;padding-left:14px;padding-right:14px':'border-bottom:1px solid var(--line2)')+'"><span>'+k+'</span><span class="muted">'+v+' ›</span></div></div>').join('')+foot()+'</div>',

   .concat('<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line2);font-size:12px"><span>上下文</span>'+seg('mode',[['turns','回合'],['full','全文']],disabled())+'</div>')
   .concat(S.mode==='turns'?'<div style="padding:8px 0;border-bottom:1px solid var(--line2)">'+slider()+'</div>':'')
   .concat(sw('advisor',S.advisor)+sw('english',S.english)+sw('readTools',S.readTools)+sw('bash',S.bash)+sw('doubleEnter',S.doubleEnter))
   .join('')+tier('stack')+'</div>'+foot()+'</div>'
}
function panelOf(key){return R[key]()}
function render(){document.getElementById('hint').textContent=V.length+' 版 · 数字键切换 · 每版包含全部控件'
 if(overview){document.querySelector('.meta').style.display='none';frame.className='overview'
  frame.innerHTML=V.map((v,i)=>'<div><div class="minilabel">'+String(i+1).padStart(2,'0')+' · '+v[0]+'</div><div class="mini" data-mini="'+i+'">'+panelOf(v[2])+'</div></div>').join('')
 }else{document.querySelector('.meta').style.display='flex';frame.className='frame'
  frame.innerHTML=panelOf(V[cur][2])
  document.getElementById('vname').textContent=String(cur+1).padStart(2,'0')+' · '+V[cur][0]
  document.getElementById('vnote').textContent=V[cur][1]}
 [...rail.children].forEach((b,n)=>b.setAttribute('aria-current',!overview&&n===cur))}
function show(i){cur=i;overview=false;render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.a==='turns')return;act(t.dataset.a,t.dataset.v)})
document.addEventListener('input',e=>{if(e.target.dataset.a==='turns'){S.turns=+e.target.value;render()}})
const q=new URLSearchParams(location.search)
if(q.get('overview')==='1'){overview=true;document.getElementById('overviewBtn').setAttribute('aria-pressed',true)}
if(q.get('v'))cur=Math.max(0,Math.min(V.length-1,(+q.get('v'))-1))
if(q.get('theme')==='light')document.body.classList.add('light')
render()
</script></body></html>
