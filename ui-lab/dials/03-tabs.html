<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旋钮 · 分段页签 · 许愿特化器</title><link rel="stylesheet" href="shared.css"></head><body>
<div class="stage"><div id="app"></div>
<div style="display:flex;justify-content:center;gap:8px;margin-top:14px">
<button id="theme" style="border:1px solid var(--line);background:transparent;color:var(--fg3);border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer">切换深浅</button>
<button data-a="fail" style="border:1px solid var(--line);background:transparent;color:var(--fg3);border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer">保存失败预览</button></div></div>
<script>const LAYOUT=()=>{const tabs=[["model","模型"],["context","上下文"],["tools","行为"]];const pane=S.tab==="model"?(permRow()+gap(12)+modelRow()+gap(12)+effortRow()):S.tab==="context"?(ctxRow()+gap(10)+(S.mode==="turns"?slider():'<p class="muted" style="font-size:11px">读入当前保留的全部回合。</p>')):allSw();return '<div class="panel">'+head()+'<div style="display:grid;place-items:center;padding:22px 16px 10px">'+knob(172)+'</div><div style="padding:0 16px">'+tierRow()+'</div><div style="display:flex;gap:2px;padding:8px 14px 0;margin-top:12px;border-top:1px solid var(--line2)">'+tabs.map(t=>'<button data-a="tab" data-v="'+t[0]+'" style="flex:1;padding:8px 6px;border:0;border-bottom:2px solid '+(S.tab===t[0]?"var(--acc)":"transparent")+';background:transparent;color:'+(S.tab===t[0]?"var(--fg)":"var(--fg3)")+';font:inherit;font-size:11.5px;cursor:pointer">'+t[1]+'</button>').join("")+'</div><div style="padding:12px 18px 16px;min-height:172px">'+pane+'</div>'+foot()+'</div>'};</script><script src="shared.js"></script></body></html>
