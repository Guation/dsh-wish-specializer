<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旋钮 · 双环 · 许愿特化器</title><link rel="stylesheet" href="shared.css"></head><body>
<div class="stage"><div id="app"></div>
<div style="display:flex;justify-content:center;gap:8px;margin-top:14px">
<button id="theme" style="border:1px solid var(--line);background:transparent;color:var(--fg3);border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer">切换深浅</button>
<button data-a="fail" style="border:1px solid var(--line);background:transparent;color:var(--fg3);border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer">保存失败预览</button></div></div>
<script>const LAYOUT=()=>'<div class="panel" style="max-width:470px;margin:0 auto">'+head()+'<div style="display:grid;place-items:center;padding:26px 16px 8px"><div style="position:relative;width:236px;height:236px">'+knob(236)+'<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;border:1px solid var(--line2);display:grid;place-content:center;gap:2px;background:var(--surface2)"><button data-a="state" data-v="'+(S.state==="extreme"?"normal":"extreme")+'" style="border:0;background:transparent;color:var(--fg);font:inherit;font-size:12px;font-weight:600;cursor:pointer">'+(S.state==="extreme"?"极限":"正常")+'</button><small class="muted" style="font-size:9.5px">模型状态</small></div></div><p class="muted" style="margin:14px 0 0;font-size:10.5px">外环拖动 = 强度 · 中心点按 = 模型状态</p></div><div style="padding:4px 18px 14px">'+permRow()+gap(10)+modelRow()+gap(10)+effortRow()+gap(10)+ctxRow()+gap(8)+(S.mode==="turns"?slider():"")+gap(4)+allSw()+'</div>'+foot()+'</div>';</script><script src="shared.js"></script></body></html>
