<!doctype html><html lang="zh" data-tier="heavy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双环 · 成品 · 许愿特化器</title>
<style>
:root{--bg:#0b0c0e;--surface:#17191d;--surface2:#1d2025;--chip:#23262c;--line:#2d3138;--line2:#24272d;--fg:#eceef2;--fg2:#b9bfc9;--fg3:#7f8794;--danger:#f2545b;--warn:#f2a03c;--ok:#3ecf8e;--sh:0 26px 70px -30px rgba(0,0,0,.9)}
body.light{--bg:#ededea;--surface:#fff;--surface2:#f6f6f2;--chip:#eaeae4;--line:#d7d7d0;--line2:#e6e6df;--fg:#181a1d;--fg2:#464b53;--fg3:#787f87;--sh:0 26px 60px -32px rgba(24,30,44,.28)}
html[data-tier=off]{--tier:#8b8f98;--glow:rgba(139,143,152,.18);--p:198}
html[data-tier=light]{--tier:#43c9a4;--glow:rgba(67,201,164,.30);--p:66}
html[data-tier=standard]{--tier:#5b9bff;--glow:rgba(91,155,255,.40);--p:132}
html[data-tier=heavy]{--tier:#a970ff;--glow:rgba(169,112,255,.50);--p:198}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--bg);color:var(--fg);font:14px/1.55 Inter,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.stage{width:100%;max-width:920px;display:grid;justify-items:center;gap:14px}
.panel{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden;animation:in .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line2)}
.hd strong{font-size:14px;font-weight:650}
.hd .save{margin-left:auto;font-size:11px;color:var(--fg3);transition:color .3s,opacity .3s}
.hd .save[data-s=saving]{color:var(--tier)}
.hd .save[data-s=error]{color:var(--danger)}
.x{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--fg3);font-size:18px;line-height:1;cursor:pointer;transition:.15s}
.x:hover{background:var(--chip);color:var(--fg);transform:rotate(90deg)}
.wrap{display:grid;grid-template-columns:330px minmax(0,1fr)}
.left{padding:26px 20px 22px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:18px;background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--tier) 13%,transparent),transparent 70%)}
.ringbox{position:relative;display:grid;place-items:center;height:250px}
.knob{position:relative;touch-action:none;cursor:grab;user-select:none;display:grid;place-items:center;border-radius:50%}
.knob:active{cursor:grabbing}
.knob:focus-visible{outline:2px solid var(--tier);outline-offset:9px}
.knob svg{display:block;overflow:visible}
.arc-bg{fill:none;stroke:var(--line);stroke-linecap:round}
.arc-fg{fill:none;stroke:var(--tier);stroke-linecap:round;filter:drop-shadow(0 0 7px var(--glow));transition:stroke .4s ease,stroke-dasharray .38s cubic-bezier(.2,.9,.25,1.06),filter .4s}
.needle{stroke:var(--tier);stroke-width:2;stroke-linecap:round;transition:stroke .4s}
.needle-g{transition:transform .1s linear}
.knob.snap .needle-g{transition:transform .36s cubic-bezier(.2,.9,.25,1.06)}
.tick{stroke:var(--line);stroke-width:1.5;stroke-linecap:round;transition:stroke .3s,stroke-width .3s}
.tick[data-on=true]{stroke:var(--tier);stroke-width:2.4}
.halo{position:absolute;inset:-10px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--glow),transparent 62%);opacity:0;transition:opacity .5s,transform .5s}
html[data-tier=light] .halo{opacity:.3}
html[data-tier=standard] .halo{opacity:.55;animation:breathe 4.4s ease-in-out infinite}
html[data-tier=heavy] .halo{opacity:.8;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.97);opacity:.5}50%{transform:scale(1.05);opacity:.95}}
.sweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0}
html[data-tier=standard] .sweep{opacity:.45;background:conic-gradient(from 0deg,transparent 0 76%,var(--glow) 92%,transparent 100%);animation:spin 6.5s linear infinite;mask:radial-gradient(circle,transparent 56%,#000 58%)}
html[data-tier=heavy] .sweep{opacity:.85;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fx{position:absolute;inset:6px;border-radius:50%;pointer-events:none;overflow:hidden;mask:radial-gradient(circle,transparent 54%,#000 58%,#000 96%,transparent 100%)}
.fx i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--tier);opacity:0;box-shadow:0 0 7px var(--glow)}
html[data-tier=standard] .fx i{opacity:.5;animation:drift 5s linear infinite alternate}
html[data-tier=heavy] .fx i{opacity:.9;animation:meteor 2.4s linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes meteor{0%{transform:translate(0,0) scale(1);opacity:0}14%{opacity:1}100%{transform:translate(var(--mx),var(--my)) scale(.4);opacity:0}}
.tlabel{position:absolute;font-size:9px;letter-spacing:.06em;color:var(--fg3);white-space:nowrap;pointer-events:none;padding:1px 4px;border-radius:5px;background:color-mix(in srgb,var(--surface) 82%,transparent);transition:color .25s,background .25s}
.tlabel[data-on=true]{color:var(--tier);font-weight:600;background:color-mix(in srgb,var(--tier) 14%,var(--surface))}
.gapword{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);text-align:center;pointer-events:none}
.gapword b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;color:var(--tier);text-shadow:0 0 22px var(--glow);transition:color .35s}
.gapword small{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3)}
.desc{font-size:12px;line-height:1.6;color:var(--fg3);text-align:center;min-height:38px}
.lab{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg3)}
.mini{display:flex;flex-direction:column;gap:11px;padding-top:16px;border-top:1px solid var(--line2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border:1px solid var(--line2);border-radius:10px;background:var(--chip)}
.seg button{min-height:31px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--fg3);font:inherit;font-size:12.5px;cursor:pointer;transition:background .22s,color .22s,box-shadow .26s,transform .16s}
.seg button:hover:not(:disabled):not([aria-checked=true]){background:var(--surface);color:var(--fg)}
.seg button[aria-checked=true]{background:color-mix(in srgb,var(--tier) 20%,var(--surface));color:var(--tier);border-color:color-mix(in srgb,var(--tier) 44%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--tier) 12%,transparent);font-weight:600}
.seg button[data-v=extreme][aria-checked=true]{background:color-mix(in srgb,#f2545b 20%,var(--surface));color:#ff858b;border-color:#f2545b66;box-shadow:0 0 0 3px #f2545b22}
.seg button[data-v=auto][aria-checked=true]{background:color-mix(in srgb,#f2a03c 20%,var(--surface));color:#ffbe74;border-color:#f2a03c66;box-shadow:0 0 0 3px #f2a03c22}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.right{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.pick{position:relative}
.pick>button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:34px;padding:6px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--chip);color:var(--fg2);font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .18s,background .18s,transform .18s,color .18s}
.pick>button:hover{border-color:color-mix(in srgb,var(--tier) 50%,var(--line));transform:translateY(-1px);color:var(--fg)}
.menu{position:absolute;right:0;top:calc(100% + 5px);z-index:8;min-width:170px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--sh);animation:in .14s ease-out both}
.menu button{display:block;width:100%;padding:7px 9px;border:0;border-radius:7px;background:transparent;color:var(--fg2);font:inherit;font-size:12px;text-align:left;cursor:pointer;transition:background .16s,color .16s}
.menu button:hover{background:color-mix(in srgb,var(--tier) 16%,var(--chip));color:var(--fg)}
.menu button[aria-selected=true]{color:var(--tier);background:var(--chip)}
.grp{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line2)}
.grp:last-child{border-bottom:0;padding-bottom:0}
.rng{padding-top:2px}
.rng input{appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
.rng input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--tier) 0 var(--pct),var(--line) var(--pct) 100%);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.rng input::-webkit-slider-thumb{appearance:none;width:17px;height:17px;margin-top:-5.5px;border-radius:50%;background:var(--surface);border:2px solid var(--tier);box-shadow:0 0 0 4px color-mix(in srgb,var(--tier) 16%,transparent),0 2px 6px rgba(0,0,0,.45);transition:transform .16s,box-shadow .2s}
.rng input:hover::-webkit-slider-thumb{transform:scale(1.16);box-shadow:0 0 0 8px color-mix(in srgb,var(--tier) 20%,transparent),0 2px 8px rgba(0,0,0,.5)}
.rng .ticks{display:flex;justify-content:space-between;padding:0 2px;font-size:9.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.swgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.swline{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--fg);font:inherit;font-size:12.5px;text-align:left;cursor:pointer;transition:color .18s}
.swline:hover{color:var(--tier)}
.sw{position:relative;width:28px;height:16px;flex:0 0 28px;border:1px solid var(--line);border-radius:9px;transition:background .2s,border-color .2s,transform .18s,box-shadow .24s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--fg3);transition:transform .2s cubic-bezier(.2,.9,.25,1.1),background .2s}
[aria-checked=true] .sw{background:var(--tier);border-color:var(--tier);box-shadow:0 0 12px var(--glow)}
[aria-checked=true] .sw:after{transform:translateX(12px);background:var(--surface)}
.swline:hover .sw{transform:scale(1.07)}
.detailrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 0 2px;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--fg2);font:inherit;font-size:12.5px;cursor:pointer;transition:color .2s}
.detailrow:hover{color:var(--tier)}
.detailrow .chev{color:var(--fg3);transition:transform .22s}
.detailrow:hover .chev{transform:translateX(3px);color:var(--tier)}
.ic{width:15px;height:15px;flex:0 0 15px;opacity:.8;transition:opacity .2s,color .2s}
.swline:hover .ic,.detailrow:hover .ic{opacity:1;color:var(--tier)}
</style></head><body>
<div class="stage"><div id="app"></div>
<div style="display:flex;gap:8px"><button id="theme" class="tbtn">切换深浅</button><button id="fail" class="tbtn">保存失败预览</button></div></div>
<style>.tbtn{border:1px solid var(--line);background:transparent;color:var(--fg3);border-radius:8px;padding:6px 12px;font:inherit;font-size:11.5px;cursor:pointer;transition:.16s}.tbtn:hover{color:var(--fg);border-color:var(--tier)}</style>
<script>
var svg=function(p){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
var IC={state:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/>',perm:'<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',model:'<rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M7 21h10"/>',effort:'<path d="M4 17l5-6 4 3 6-8"/>',ctx:'<path d="M4 7h16M4 12h10M4 17h13"/>',turns:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',advisor:'<path d="M12 3l2.2 5.4L20 10.5l-4.4 3.7L16.9 20 12 16.9 7.1 20l1.3-5.8L4 10.5l5.8-2.1z"/>',english:'<path d="M4 6h9M8.5 6v13M4 19h7"/><path d="M14 12h6M17 12v7"/>',readTools:'<path d="M6 4l4 4-2 2-4-4z"/><path d="M13 11l7 7-2 2-7-7z"/>',bash:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3M13 15h4"/>',doubleEnter:'<path d="M20 5v6a3 3 0 0 1-3 3H6"/><path d="M9 10l-3 3 3 3"/>',detail:'<circle cx="12" cy="12" r="8"/><path d="M12 11v6M12 8h.01"/>'};
var S={tier:'heavy',state:'extreme',permission:'auto',model:'follow',effort:'max',mode:'turns',turns:6,advisor:true,english:false,readTools:true,bash:true,doubleEnter:true,save:'idle',fail:false};
var TIERS=[['off','关闭'],['light','轻度'],['standard','标准'],['heavy','重度']];
var TN={off:'关闭',light:'轻度',standard:'标准',heavy:'重度'};
var TD={off:'不拦截，原话直接发送。',light:'少量补充，只点出最关键的方向。',standard:'展开关键方向，保留你的判断空间。',heavy:'深入展开，把想法往前多推一步。'};
var MODELS=[['follow','跟随会话模型'],['v31','DeepSeek V3.1'],['r1','DeepSeek R1']];
var EFFORTS=[['max','Max'],['high','High'],['off','Off']];
var ARC=[198,66,132,198];
var idx=function(){for(var i=0;i<TIERS.length;i++)if(TIERS[i][0]===S.tier)return i;return 3};
var dis=function(){return S.tier==='off'&&!S.english};
var dots='';
for(var k=0;k<24;k++){dots+='<i style="left:'+(9+(k*37)%82)+'%;top:'+(8+(k*53)%84)+'%;--dx:'+(((k*29)%38)-19)+'px;--dy:'+(((k*17)%26)-13)+'px;--mx:'+(-(((k*41)%70)+30))+'px;--my:'+(((k*23)%40)-20)+'px;animation-delay:-'+((k*37)%90)/30+'s"></i>'}
var knobHTML='<div class="knob" id="knob" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3"><svg viewBox="0 0 100 100" width="224" height="224"><circle class="arc-bg" cx="50" cy="50" r="42" stroke-width="5" stroke-dasharray="198 264" transform="rotate(135 50 50)"/><circle class="arc-fg" id="arc" cx="50" cy="50" r="42" stroke-width="5" stroke-dasharray="198 264" transform="rotate(135 50 50)"/><g id="ticks"></g><g class="needle-g" id="needle"><line class="needle" x1="50" y1="50" x2="50" y2="20"/></g><circle cx="50" cy="50" r="3.5" fill="var(--fg)"/></svg></div>';
var labels='';
[[-135,'关闭'],[-45,'轻度'],[45,'标准'],[135,'重度']].forEach(function(o){var a=o[0],txt=o[1],r=Math.PI*a/180,x=50+61*Math.sin(r),y=50-61*Math.cos(r);labels+='<span class="tlabel" data-a="'+a+'" style="left:'+x.toFixed(1)+'%;top:'+y.toFixed(1)+'%;transform:translate(-50%,-50%)">'+txt+'</span>'});
var sws='';
[['advisor','顾问'],['english','英文模式'],['readTools','只读工具'],['bash','内置 Bash'],['doubleEnter','双击 Enter 跳过']].forEach(function(p){sws+='<button class="swline" data-sw="'+p[0]+'"><span class="lab">'+svg(IC[p[0]])+p[1]+'</span><span class="sw"></span></button>'});
document.getElementById('app').innerHTML='<div class="panel"><div class="hd"><strong>优化选项</strong><span class="save" id="save" data-s="idle">自动保存</span><button class="x" id="close">×</button></div><div class="wrap"><div class="left"><div class="ringbox"><div class="halo"></div><div class="sweep"></div><div class="fx">'+dots+'</div>'+knobHTML+labels+'<div class="gapword"><b id="tname">重度</b><small>强度</small></div></div><div class="desc" id="desc">'+TD.heavy+'</div><div class="mini"><span class="lab">'+svg(IC.state)+'模型状态</span><div class="seg" data-seg="state"><button data-v="normal">正常</button><button data-v="extreme">极限</button></div><span class="lab">'+svg(IC.perm)+'权限</span><div class="seg" data-seg="permission"><button data-v="review">审查</button><button data-v="auto">自动</button></div></div></div><div class="right"><div class="rgrid"><div class="field"><span class="lab">'+svg(IC.model)+'模型</span><div class="pick" data-pick="model"><button><span class="pv">跟随会话模型</span><span aria-hidden="true">▾</span></button><div class="menu" hidden></div></div></div><div class="field"><span class="lab">'+svg(IC.effort)+'思考档位</span><div class="pick" data-pick="effort"><button><span class="pv">Max</span><span aria-hidden="true">▾</span></button><div class="menu" hidden></div></div></div></div><div class="grp"><div class="row" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span class="lab">'+svg(IC.ctx)+'上下文</span><div class="seg" data-seg="mode" style="width:176px"><button data-v="turns">回合</button><button data-v="full">全文</button></div></div><div id="turnsBox"><div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--fg3)"><span class="lab">'+svg(IC.turns)+'回合数</span><b id="turnsNum" style="color:var(--tier);font-size:13px">6</b></div><div class="rng"><input id="turns" type="range" min="0" max="10" value="6"><div class="ticks"><span>0</span><span>5</span><span>10</span></div></div></div></div><div class="grp"><div class="swgrid">'+sws+'</div><button class="detailrow" id="detail"><span class="lab">'+svg(IC.detail)+'详情<span style="color:var(--fg3);font-size:11px;margin-left:6px">状态与提示词</span></span><span class="chev">›</span></button></div></div></div></div>';
var q=function(s){return document.querySelector(s)};
var knob=q('#knob'),arc=q('#arc'),needle=q('#needle'),tname=q('#tname'),desc=q('#desc'),sv=q('#save'),ticks=q('#ticks'),rng=q('#turns');
ticks.innerHTML='';
for(var i=0;i<4;i++){var a=(-135+90*i)*Math.PI/180,c=(50+31*Math.sin(a)).toFixed(2),s1=(50-31*Math.cos(a)).toFixed(2),c2=(50+27*Math.sin(a)).toFixed(2),s2=(50-27*Math.cos(a)).toFixed(2);ticks.innerHTML+='<line class="tick" data-i="'+i+'" x1="'+c+'" y1="'+s1+'" x2="'+c2+'" y2="'+s2+'"/>'}
function paint(){
  var i=idx();
  arc.setAttribute('stroke-dasharray',ARC[i]+' 264');
  needle.setAttribute('transform','rotate('+(-135+90*i)+' 50 50)');
  tname.textContent=TN[S.tier];desc.textContent=TD[S.tier];
  document.documentElement.dataset.tier=S.tier;
  Array.prototype.forEach.call(ticks.children,function(t){t.dataset.on=String(+t.dataset.i===i)});
  Array.prototype.forEach.call(document.querySelectorAll('.tlabel'),function(l){l.dataset.on=String(+l.dataset.a===-135+90*i)});
  knob.setAttribute('aria-valuenow',String(i));knob.setAttribute('aria-valuetext',TN[S.tier]);
  Array.prototype.forEach.call(document.querySelectorAll('[data-seg]'),function(g){var key=g.dataset.seg;Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.setAttribute('aria-checked',String(S[key]===b.dataset.v));b.disabled=(key==='permission'||key==='mode')&&dis()})});
  Array.prototype.forEach.call(document.querySelectorAll('[data-sw]'),function(b){b.setAttribute('aria-checked',String(!!S[b.dataset.sw]))});
  Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'),function(p){var key=p.dataset.pick,list=key==='model'?MODELS:EFFORTS,cur=list[0];list.forEach(function(o){if(o[0]===S[key])cur=o});p.querySelector('.pv').textContent=cur[1]});
  q('#turnsNum').textContent=String(S.turns);rng.value=String(S.turns);rng.style.setProperty('--pct',(S.turns*10)+'%');
  q('#turnsBox').style.display=S.mode==='turns'?'':'none';
  sv.dataset.s=S.fail?'error':S.save;
  sv.textContent=S.fail?'保存失败 · 点此重试':(S.save==='saving'?'保存中…':'自动保存');
}
var timer=null;
function commit(){if(S.fail)return;S.save='saving';paint();clearTimeout(timer);timer=setTimeout(function(){S.save='saved';paint()},420)}
function ang(e){var r=knob.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,a=Math.atan2(e.clientX-cx,cy-e.clientY)*180/Math.PI;return Math.max(-135,Math.min(135,a))}
function tierAt(a){var i=Math.round((a+135)/90);return TIERS[Math.max(0,Math.min(3,i))][0]}
var drag=false;
knob.addEventListener('pointerdown',function(e){drag=true;knob.classList.remove('snap');if(knob.setPointerCapture)knob.setPointerCapture(e.pointerId);var a=ang(e);needle.setAttribute('transform','rotate('+a+' 50 50)');var t=tierAt(a);if(t!==S.tier){S.tier=t;paint();commit()}});
knob.addEventListener('pointermove',function(e){if(!drag)return;var a=ang(e);needle.setAttribute('transform','rotate('+a+' 50 50)');var t=tierAt(a);if(t!==S.tier){S.tier=t;paint();commit()}});
function endDrag(){if(!drag)return;drag=false;knob.classList.add('snap');paint()}
knob.addEventListener('pointerup',endDrag);knob.addEventListener('pointercancel',endDrag);
knob.addEventListener('keydown',function(e){var i=idx(),n=null;
 if(e.key==='ArrowUp'||e.key==='ArrowRight')n=Math.min(3,i+1);
 else if(e.key==='ArrowDown'||e.key==='ArrowLeft')n=Math.max(0,i-1);
 else if(e.key==='Home')n=0;else if(e.key==='End')n=3;
 if(n===null)return;e.preventDefault();knob.classList.add('snap');S.tier=TIERS[n][0];paint();commit()});
document.addEventListener('click',function(e){
 var sg=e.target.closest('[data-seg] button');
 if(sg){if(sg.disabled)return;var key=sg.closest('[data-seg]').dataset.seg;if(S[key]===sg.dataset.v)return;S[key]=sg.dataset.v;commit();return}
 var sw=e.target.closest('[data-sw]');
 if(sw){S[sw.dataset.sw]=!S[sw.dataset.sw];commit();return}
 var pb=e.target.closest('[data-pick]>button');
 if(pb){var w=pb.parentElement,key2=w.dataset.pick,m=w.querySelector('.menu');Array.prototype.forEach.call(document.querySelectorAll('.menu'),function(x){if(x!==m)x.hidden=true});
  if(m.hidden){var list=key2==='model'?MODELS:EFFORTS,txt='';list.forEach(function(o){txt+='<button data-pv="'+o[0]+'" aria-selected="'+String(S[key2]===o[0])+'">'+o[1]+'</button>'});m.innerHTML=txt;m.hidden=false}else{m.hidden=true}
  return}
 var it=e.target.closest('[data-pv]');
 if(it){var w2=it.closest('[data-pick]');S[w2.dataset.pick]=it.dataset.pv;w2.querySelector('.menu').hidden=true;commit();return}
 if(!e.target.closest('[data-pick]'))Array.prototype.forEach.call(document.querySelectorAll('.menu'),function(m){m.hidden=true});
});
rng.addEventListener('input',function(e){S.turns=+e.target.value;q('#turnsNum').textContent=String(S.turns);rng.style.setProperty('--pct',(S.turns*10)+'%');commit()});
q('#close').addEventListener('click',function(){var p=document.querySelector('.panel');var a=p.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.985)'}],{duration:170,easing:'ease-out'});a.onfinish=function(){p.style.opacity=.4}});
document.getElementById('theme').addEventListener('click',function(){document.body.classList.toggle('light');paint()});
document.getElementById('fail').addEventListener('click',function(e){S.fail=!S.fail;e.currentTarget.setAttribute('aria-pressed',String(S.fail));paint()});
paint();
</script></body></html>
