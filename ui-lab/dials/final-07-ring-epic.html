<!doctype html><html lang="zh" data-tier="heavy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双环 · 成品 · 许愿特化器</title>
<style>
:root{--bg:#0b0c0e;--surface:#17191d;--surface2:#1d2025;--chip:#23262c;--line:#2d3138;--line2:#24272d;--fg:#eceef2;--fg2:#b9bfc9;--fg3:#7f8794;--danger:#f2545b;--warn:#f2a03c;--ok:#3ecf8e;--sh:0 26px 70px -30px rgba(0,0,0,.9)}
body.light{--bg:#ededea;--surface:#fff;--surface2:#f6f6f2;--chip:#eaeae4;--line:#d7d7d0;--line2:#e6e6df;--fg:#181a1d;--fg2:#464b53;--fg3:#787f87;--sh:0 26px 60px -32px rgba(24,30,44,.28)}
html[data-tier=off]{--tier:#8b8f98;--glow:rgba(139,143,152,.18);--p:198}
html[data-tier=light]{--tier:#43c9a4;--glow:rgba(67,201,164,.30);--p:66}
html[data-tier=standard]{--tier:#5b9bff;--glow:rgba(91,155,255,.40);--p:132}
html[data-tier=heavy]{--tier:#a970ff;--glow:rgba(169,112,255,.50);--p:198}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--bg);color:var(--fg);font:14px/1.55 Inter,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.stage{width:100%;max-width:920px;display:grid;justify-items:center;gap:14px}
.panel{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden;animation:in .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line2)}
.hd strong{font-size:14px;font-weight:650}
.hd .save{margin-left:auto;font-size:11px;color:var(--fg3);transition:color .3s,opacity .3s}
.hd .save[data-s=saving]{color:var(--tier)}
.hd .save[data-s=error]{color:var(--danger)}
.x{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--fg3);font-size:18px;line-height:1;cursor:pointer;transition:.15s}
.x:hover{background:var(--chip);color:var(--fg);transform:rotate(90deg)}
.wrap{display:grid;grid-template-columns:330px minmax(0,1fr)}
.left{padding:26px 20px 22px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:18px;background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--tier) 13%,transparent),transparent 70%)}
.ringbox{position:relative;display:grid;place-items:center;height:250px}
.knob{position:relative;touch-action:none;cursor:grab;user-select:none;display:grid;place-items:center;border-radius:50%}
.knob:active{cursor:grabbing}
.knob:focus-visible{outline:2px solid var(--tier);outline-offset:9px}
.knob svg{display:block;overflow:visible}
.arc-bg{fill:none;stroke:var(--line);stroke-linecap:round}
.arc-fg{fill:none;stroke:var(--tier);stroke-linecap:round;filter:drop-shadow(0 0 7px var(--glow));transition:stroke .4s ease,stroke-dasharray .38s cubic-bezier(.2,.9,.25,1.06),filter .4s,stroke-width .25s}
.needle{stroke:var(--tier);stroke-width:2;stroke-linecap:round;transition:stroke .4s}
.needle-g{transition:transform .1s linear}
.knob.snap .needle-g{transition:transform .36s cubic-bezier(.2,.9,.25,1.06)}
.tick{stroke:var(--line);stroke-width:1.5;stroke-linecap:round;transition:stroke .3s,stroke-width .3s}
.tick[data-on=true]{stroke:var(--tier);stroke-width:2.4}
.halo{position:absolute;inset:-10px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--glow),transparent 62%);opacity:0;transition:opacity .5s,transform .5s}
html[data-tier=light] .halo{opacity:.3}
html[data-tier=standard] .halo{opacity:.55;animation:breathe 4.4s ease-in-out infinite}
html[data-tier=heavy] .halo{opacity:.8;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.97);opacity:.5}50%{transform:scale(1.05);opacity:.95}}
.sweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0}
html[data-tier=standard] .sweep{opacity:.45;background:conic-gradient(from 0deg,transparent 0 76%,var(--glow) 92%,transparent 100%);animation:spin 6.5s linear infinite;mask:radial-gradient(circle,transparent 56%,#000 58%)}
html[data-tier=heavy] .sweep{opacity:.85;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fx{position:absolute;inset:6px;border-radius:50%;pointer-events:none;overflow:hidden;mask:radial-gradient(circle,transparent 54%,#000 58%,#000 96%,transparent 100%)}
.fx i{position:absolute;will-change:transform,opacity;width:2px;height:2px;border-radius:50%;background:var(--tier);opacity:0;box-shadow:0 0 7px var(--glow)}
html[data-tier=standard] .fx i{opacity:.5;animation:drift 5s linear infinite alternate}
html[data-tier=heavy] .fx i{opacity:.9;animation:meteor 2.4s linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes meteor{0%{transform:translate(0,0) scale(1);opacity:0}14%{opacity:1}100%{transform:translate(var(--mx),var(--my)) scale(.4);opacity:0}}
.tlabel{position:absolute;font-size:9px;letter-spacing:.06em;color:var(--fg3);white-space:nowrap;pointer-events:none;padding:1px 4px;border-radius:5px;background:color-mix(in srgb,var(--surface) 82%,transparent);transition:color .25s,background .25s}
.tlabel[data-on=true]{color:var(--tier);font-weight:600;background:color-mix(in srgb,var(--tier) 14%,var(--surface))}
.gapword{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);text-align:center;pointer-events:none}
.gapword b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;color:var(--tier);text-shadow:0 0 22px var(--glow);transition:color .35s}
.gapword small{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3)}
.desc{font-size:12px;line-height:1.6;color:var(--fg3);text-align:center;min-height:38px}
.lab{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg3)}
.mini{display:flex;flex-direction:column;gap:11px;padding-top:16px;border-top:1px solid var(--line2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border:1px solid var(--line2);border-radius:10px;background:var(--chip)}
.seg button{min-height:31px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--fg3);font:inherit;font-size:12.5px;cursor:pointer;transition:background .22s,color .22s,box-shadow .26s,transform .16s}
.seg button:hover:not(:disabled):not([aria-checked=true]){background:var(--surface);color:var(--fg)}
.seg button[aria-checked=true]{background:color-mix(in srgb,var(--tier) 20%,var(--surface));color:var(--tier);border-color:color-mix(in srgb,var(--tier) 44%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--tier) 12%,transparent);font-weight:600}
.seg button[data-v=extreme][aria-checked=true]{background:color-mix(in srgb,#f2545b 20%,var(--surface));color:#ff858b;border-color:#f2545b66;box-shadow:0 0 0 3px #f2545b22}
.seg button[data-v=auto][aria-checked=true]{background:color-mix(in srgb,#f2a03c 20%,var(--surface));color:#ffbe74;border-color:#f2a03c66;box-shadow:0 0 0 3px #f2a03c22}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.right{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.pick{position:relative}
.pick>button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:34px;padding:6px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--chip);color:var(--fg2);font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .18s,background .18s,transform .18s,color .18s}
.pick>button:hover{border-color:color-mix(in srgb,var(--tier) 50%,var(--line));transform:translateY(-1px);color:var(--fg)}
.menu{position:absolute;right:0;top:calc(100% + 5px);z-index:8;min-width:170px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--sh);animation:in .14s ease-out both}
.menu button{display:block;width:100%;padding:7px 9px;border:0;border-radius:7px;background:transparent;color:var(--fg2);font:inherit;font-size:12px;text-align:left;cursor:pointer;transition:background .16s,color .16s}
.menu button:hover{background:color-mix(in srgb,var(--tier) 16%,var(--chip));color:var(--fg)}
.menu button[aria-selected=true]{color:var(--tier);background:var(--chip)}
.grp{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line2)}
.grp:last-child{border-bottom:0;padding-bottom:0}

/* ---- 自绘回合数滑杆（与旋钮同一套手感） ---- */
.rng{padding-top:5px}
.slider{position:relative;touch-action:none;user-select:none;cursor:pointer;padding:7px 0 2px}
.slider:focus-visible{outline:2px solid var(--tier);outline-offset:7px;border-radius:10px}
.slider .track{position:relative;height:7px;border-radius:4px;background:color-mix(in srgb,var(--line) 92%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.38)}
.slider .fill{position:absolute;left:0;top:0;bottom:0;width:var(--pos,60%);border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--tier) 42%,transparent),var(--tier));box-shadow:0 0 12px color-mix(in srgb,var(--tier) 38%,transparent);transition:width .34s cubic-bezier(.2,.9,.25,1.06)}
.slider.dragging .fill{transition:none;box-shadow:0 0 16px color-mix(in srgb,var(--tier) 52%,transparent)}
.slider .marks{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),color-mix(in srgb,var(--fg3) 45%,transparent) calc(10% - 1px) 10%);mask:linear-gradient(90deg,transparent 0 var(--pos,60%),#000 var(--pos,60%) 100%)}
.slider .thumb{position:absolute;top:50%;left:var(--pos,60%);width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;background:var(--surface);border:2px solid var(--tier);box-shadow:0 0 0 4px color-mix(in srgb,var(--tier) 15%,transparent),0 2px 7px rgba(0,0,0,.5);transition:left .34s cubic-bezier(.2,.9,.25,1.06),transform .16s,box-shadow .22s}
.slider.dragging{cursor:grabbing}
.slider.dragging .thumb{transition:transform .16s,box-shadow .22s}
.slider:hover .thumb,.slider.dragging .thumb{transform:scale(1.18);box-shadow:0 0 0 8px color-mix(in srgb,var(--tier) 20%,transparent),0 2px 9px rgba(0,0,0,.55)}
.slider.disabled{opacity:.4;pointer-events:none}
.rng .ticks{display:flex;justify-content:space-between;padding:0 2px;font-size:9.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.swgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.swline{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--fg);font:inherit;font-size:12.5px;text-align:left;cursor:pointer;transition:color .18s}
.swline:hover{color:var(--tier)}
.sw{position:relative;width:28px;height:16px;flex:0 0 28px;border:1px solid var(--line);border-radius:9px;transition:background .2s,border-color .2s,transform .18s,box-shadow .24s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--fg3);transition:transform .2s cubic-bezier(.2,.9,.25,1.1),background .2s}
[aria-checked=true] .sw{background:var(--tier);border-color:var(--tier);box-shadow:0 0 12px var(--glow)}
[aria-checked=true] .sw:after{transform:translateX(12px);background:var(--surface)}
.swline:hover .sw{transform:scale(1.07)}
.detailrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 0 2px;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--fg2);font:inherit;font-size:12.5px;cursor:pointer;transition:color .2s}
.detailrow:hover{color:var(--tier)}
.detailrow .chev{color:var(--fg3);transition:transform .22s}
.detailrow:hover .chev{transform:translateX(3px);color:var(--tier)}
.ic{width:15px;height:15px;flex:0 0 15px;opacity:.8;transition:opacity .2s,color .2s}
.swline:hover .ic,.detailrow:hover .ic{opacity:1;color:var(--tier)}
</style>
<style>
/* ============ 张力层：一条时间轴，换挡只换参数 ============ */
@property --tier{syntax:'<color>';inherits:true;initial-value:#a970ff}
@property --glow{syntax:'<color>';inherits:true;initial-value:rgba(169,112,255,.5)}
@property --tierA{syntax:'<number>';inherits:true;initial-value:1}
@property --pMin{syntax:'<number>';inherits:true;initial-value:.3}
@property --pMax{syntax:'<number>';inherits:true;initial-value:1}
@property --shockA{syntax:'<number>';inherits:true;initial-value:0}
@property --flashA{syntax:'<number>';inherits:true;initial-value:0}
@property --arcHiA{syntax:'<number>';inherits:true;initial-value:0}
@property --chargeA{syntax:'<number>';inherits:true;initial-value:0}
@property --filA{syntax:'<number>';inherits:true;initial-value:0}
@property --rayA{syntax:'<number>';inherits:true;initial-value:0}
@property --vastA{syntax:'<number>';inherits:true;initial-value:0}
@property --sigilA{syntax:'<number>';inherits:true;initial-value:0}
@property --burstA{syntax:'<number>';inherits:true;initial-value:0}
@property --travel{syntax:'<number>';inherits:true;initial-value:1}
@property --orbitA{syntax:'<number>';inherits:true;initial-value:0}
@property --arcGlow{syntax:'<length>';inherits:true;initial-value:7px}
@property --arcPulse{syntax:'<number>';inherits:true;initial-value:.1}
html{transition:--tier .5s ease,--glow .5s ease,--tierA .4s ease,--shockA .35s ease,--flashA .35s ease,--arcHiA .35s ease,--chargeA .35s ease,--filA .35s ease,--rayA .5s ease,--vastA .5s ease,--sigilA .5s ease,--burstA .4s ease,--travel .4s ease,--orbitA .5s ease,--arcGlow .5s ease,--arcPulse .5s ease}
html{--beat:2.4s;--pMin:.3;--pMax:1;--tierA:.32;--shockA:0;--flashA:0;--arcHiA:0;--chargeA:0;--filA:0;--rayA:0;--vastA:0;--sigilA:0;--burstA:0;--travel:.4;--arcGlow:6px;--arcPulse:.02;--orbitA:0}
html[data-tier=light]{--tierA:.5;--rayA:.05;--vastA:.08;--orbitA:.4}
html[data-tier=standard]{--tierA:.78;--shockA:.55;--arcHiA:.32;--chargeA:.34;--rayA:.07;--vastA:.12;--burstA:.4;--travel:.5;--arcGlow:6px;--arcPulse:.1;--orbitA:.55}
html[data-tier=heavy]{--tierA:1;--shockA:.85;--flashA:.36;--arcHiA:.45;--chargeA:.6;--filA:.9;--rayA:.17;--vastA:.16;--sigilA:.3;--burstA:.85;--travel:1;--arcGlow:7px;--arcPulse:.14;--orbitA:.9}
.left{overflow:hidden}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;box-shadow:inset 0 0 90px -44px var(--glow);opacity:.45;transition:opacity .7s,box-shadow .6s}
html[data-tier] .panel::after{animation:innerPulse var(--beat) ease-in-out infinite}
@keyframes innerPulse{0%,100%{opacity:calc(.12 + var(--pMax) * .34)}56%{opacity:calc(.12 + var(--pMax) * .7)}64%{opacity:calc(.12 + var(--pMax) * .9)}}
.hd{position:relative}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--tier),transparent);opacity:0;transition:opacity .6s}
html[data-tier] .hd::after{animation:ruleBeat var(--beat) ease-in-out infinite}
@keyframes ruleBeat{0%,100%{opacity:calc(var(--pMax) * .16)}56%{opacity:calc(var(--pMax) * .6)}64%{opacity:var(--pMax)}}
.left{position:relative}
.left::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 62% at 50% 0%,var(--tier),transparent 72%);opacity:0;transition:opacity .45s ease}
.left>*{position:relative;z-index:1}
html[data-tier=light] .left::before{opacity:.02}
html[data-tier=standard] .left::before{opacity:.05}
html[data-tier=heavy] .left::before{opacity:.12}

.fxwrap{position:absolute;inset:0;pointer-events:none;opacity:var(--tierA);transition:opacity .35s ease}
.rays{position:absolute;inset:0;margin:auto;width:300px;height:300px;border-radius:50%;pointer-events:none;opacity:var(--rayA);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tier) 62%,transparent) 0deg .55deg,transparent .55deg 7.2deg);mask:radial-gradient(circle,transparent 0 33%,#000 40%,#000 45%,transparent 49%);animation:spin 78s linear infinite;transition:opacity .6s}
.void{display:none}
.vast{will-change:transform;position:absolute;inset:0;margin:auto;pointer-events:none;overflow:visible;width:520px;height:520px;opacity:var(--vastA);animation:spin 96s linear infinite;transition:opacity .6s}
.vast svg{display:block;width:100%;height:100%;overflow:visible}
.vast circle{fill:none;stroke:var(--tier);stroke-linecap:round}
.vast .r1{stroke-width:.55;stroke-dasharray:1.5 7;opacity:.5}
.vast .r2{stroke-width:.4;stroke-dasharray:.8 13;opacity:.3}
.sigil{will-change:transform,opacity;position:absolute;inset:0;margin:auto;width:238px;height:238px;pointer-events:none;opacity:var(--sigilA);animation:spin 30s linear infinite;transition:opacity .6s}
.sigil svg{width:100%;height:100%;display:block}
.sigil circle{fill:none;stroke:var(--tier);stroke-width:.5;stroke-dasharray:1.3 5.4}
.arc-hi{will-change:opacity;fill:none;stroke:color-mix(in srgb,var(--tier) 35%,#fff);stroke-linecap:round;opacity:0;animation:hiBeat var(--beat) ease-in-out infinite;transition:stroke-dasharray .38s cubic-bezier(.2,.9,.25,1.06)}
@keyframes hiBeat{0%,100%{opacity:calc(var(--arcHiA) * .62)}58%{opacity:var(--arcHiA)}64%{opacity:calc(var(--arcHiA) * 1.45)}}
.hub{fill:var(--fg);stroke:color-mix(in srgb,var(--tier) 70%,transparent);stroke-width:1;filter:drop-shadow(0 0 6px var(--glow))}
body.light .hub{fill:#fff}
.tick{stroke:color-mix(in srgb,var(--tier) 26%,var(--line));stroke-width:1.1}
.tick[data-on=true]{stroke:color-mix(in srgb,var(--tier) 85%,#fff);stroke-width:1.7;filter:drop-shadow(0 0 5px var(--tier))}
html[data-tier] .halo{display:none}
.aura{position:absolute;inset:0;margin:auto;width:300px;height:300px;will-change:transform,opacity;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--glow),transparent 66%);filter:blur(14px);opacity:var(--pMin);animation:auraBeat var(--beat) cubic-bezier(.42,0,.58,1) infinite;transition:filter .6s}
@keyframes auraBeat{0%{transform:scale(.86);opacity:var(--pMin)}56%{transform:scale(1.05);opacity:calc(var(--pMax) * .82)}64%{transform:scale(1.2);opacity:var(--pMax)}78%{transform:scale(1.03);opacity:calc(var(--pMax) * .58)}100%{transform:scale(.86);opacity:var(--pMin)}}
.core{position:absolute;inset:0;margin:auto;width:56px;height:56px;will-change:transform,opacity;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--tier) 60%,transparent),transparent 72%);opacity:var(--pMin);animation:coreBeat var(--beat) cubic-bezier(.42,0,.58,1) infinite}
@keyframes coreBeat{0%{transform:scale(.62);opacity:calc(var(--pMin) * .85)}56%{transform:scale(1.02);opacity:calc(var(--pMax) * .7)}64%{transform:scale(1.34);opacity:var(--pMax)}80%{transform:scale(.98);opacity:calc(var(--pMax) * .5)}100%{transform:scale(.62);opacity:calc(var(--pMin) * .85)}}

.shock{position:absolute;inset:0;pointer-events:none}
.shock i{position:absolute;inset:0;margin:auto;width:224px;height:224px;will-change:transform,opacity;border-radius:50%;border:1.4px solid color-mix(in srgb,var(--tier) 78%,#fff);opacity:0;box-shadow:0 0 20px color-mix(in srgb,var(--tier) 62%,transparent),inset 0 0 14px color-mix(in srgb,var(--tier) 45%,transparent);animation:shock var(--beat) cubic-bezier(.12,.7,.2,1) infinite}
.shock i:nth-child(2){animation-delay:calc(var(--beat) * .12)}
.shock i:nth-child(3){animation-delay:calc(var(--beat) * .24)}
@keyframes shock{0%,56%{transform:scale(1.02);opacity:0}59%{opacity:var(--shockA)}100%{transform:scale(1.42);opacity:0}}

.sweep{inset:0;margin:auto;width:224px;height:224px;animation:spin 6.5s linear infinite;transition:opacity .4s;will-change:transform,opacity}
html[data-tier] .sweep{opacity:0}
html[data-tier=standard] .sweep{opacity:.45;background:conic-gradient(from 0deg,transparent 0 76%,var(--glow) 92%,transparent 100%);mask:radial-gradient(circle,transparent 56%,#000 58%)}
html[data-tier=heavy] .sweep{opacity:.8;background:conic-gradient(from 0deg,transparent 0 70%,var(--glow) 90%,transparent 100%);mask:radial-gradient(circle,transparent 56%,#000 58%)}
.vortex{position:absolute;inset:0;margin:auto;width:206px;height:206px;border-radius:50%;pointer-events:none;opacity:0;background:conic-gradient(from 0deg,transparent 0 50%,var(--glow) 74%,transparent 92%);filter:blur(5px);mask:radial-gradient(circle,transparent 34%,#000 50%,#000 64%,transparent 71%);animation:spin 15s linear infinite;transition:opacity .6s}
html[data-tier=standard] .vortex{opacity:.24}
html[data-tier=heavy] .vortex{opacity:.5}

function endSegDrag(){if(!segDrag)return;var d=segDrag;segDrag=null;if(d.moved){d.seg.classList.remove('dragging');syncSeg(d.seg)}}

  q('#turnsNum').textContent=String(S.turns);q('#turns').setAttribute('aria-valuenow',String(S.turns));if(!turnsDrag)q('#turns').style.setProperty('--pos',(S.turns*10)+'%');

var timer=null;

function ang(e){var r=knob.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,a=Math.atan2(e.clientX-cx,cy-e.clientY)*180/Math.PI;return Math.max(-135,Math.min(135,a))}

});
var turnTrack=q('#turns'),turnsDrag=null;
function setTurns(v){
  v=Math.max(0,Math.min(10,Math.round(v)));
  if(S.turns!==v){S.turns=v;commit()}
  q('#turnsNum').textContent=String(S.turns);

function turnFraction(e){
