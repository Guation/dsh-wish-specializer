<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双环 · 仪表盘 · 许愿特化器</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="tiers.css"></head><body>
<div class="stage"><div id="app"></div>
<div style="display:flex;justify-content:center;gap:8px;margin-top:14px">
<button id="theme" style="border:1px solid var(--line);background:transparent;color:var(--fg3);border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer">切换深浅</button>
<button data-a="fail" style="border:1px solid var(--line);background:transparent;color:var(--fg3);border-radius:8px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer">保存失败预览</button></div></div>
<script>const LAYOUT=()=>'<div class="panel">'+head()+'<div style="display:grid;grid-template-columns:280px minmax(0,1fr)"><div style="display:grid;place-items:center;padding:26px 12px 22px;border-right:1px solid var(--line2);background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--tier) 10%,transparent),transparent 72%)">'+'<div style="position:relative;width:212px;height:212px"><div class="halo"></div><div class="sweep"></div>'+knob(212)+'</div>'+'<div class="dots" style="margin-top:14px">'+TIERS.map(function(t){return '<i data-on="'+(S.tier===t[0])+'"></i>'}).join('')+'</div></div><div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px">'+tierRow()+permRow()+modelRow()+effortRow()+ctxRow()+(S.mode==='turns'?slider():'')+'<div style="margin-top:2px;border-top:1px solid var(--line2);padding-top:6px">'+allSw()+'</div></div></div>'+foot()+'</div>';</script><script src="shared.js"></script></body></html>
