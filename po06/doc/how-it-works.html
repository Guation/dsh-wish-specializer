<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 仲裁者插件 · 它是怎么运作的</title>
<style>
  :root{
    --bg:#0f1115; --panel:#151922; --panel2:#1b2130; --line:#2a3040; --line2:#222836;
    --fg:#e7eaf3; --fg2:#aab3c5; --fg3:#7b849a; --accent:#6ea8fe; --accent2:#8f7bff;
    --ok:#4bbf7a; --warn:#e0b050; --err:#e06c6c; --code:#0b0e13; --shadow:0 11px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7fa; --panel:#ffffff; --panel2:#f1f3f8; --line:#dfe3ec; --line2:#e9ecf3;
      --fg:#1b2130; --fg2:#4a5468; --fg3:#7b849a; --accent:#2f6fdc; --accent2:#6a4fe0;
      --ok:#1f8f52; --warn:#a5720a; --err:#b43b3b; --code:#f3f5fa; --shadow:0 11px 30px rgba(20,30,60,.12);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.65 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
  a{color:var(--accent)}
  code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace}

  header{padding:22px 24px 10px;max-width:1120px;margin:0 auto}
  h1{margin:0 0 4px;font-size:20px;letter-spacing:.2px}
  .sub{color:var(--fg2);margin:0 0 12px;max-width:72ch}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
  .chip{font-size:12px;color:var(--fg2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--panel)}
  .chip b{color:var(--fg);font-weight:600}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
  .tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .tabs button{border:0;background:transparent;color:var(--fg2);padding:7px 14px;font:inherit;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--panel2);color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
  input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);
    padding:7px 11px;font:inherit;min-width:210px;flex:1 1 220px}
  .btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--fg2);
    padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--fg)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px;color:var(--fg3);font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:5px}

  main{max-width:1120px;margin:0 auto;padding:0 24px 40px}
  .intro{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;margin:0 0 16px;color:var(--fg2);max-width:72ch}
  .intro b{color:var(--fg)}
  .pipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px}
  .pipe .step{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 10px;
    font:inherit;font-size:12.5px;color:var(--fg2);cursor:pointer}
  .pipe .step:hover{border-color:var(--accent);color:var(--fg)}
  .pipe .arrow{color:var(--fg3);font-size:12px}

  /* ── 树 ─────────────────────────────────────────── */
  .tree,.tree ul{list-style:none;margin:0;padding:0}
  .tree ul{margin-left:17px;padding-left:15px;border-left:1px solid var(--line2)}
  .tree li{position:relative;margin:7px 0}
  .tree ul>li::before{content:"";position:absolute;left:-15px;top:17px;width:13px;height:1px;background:var(--line2)}
  .node{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
  .node[open]{border-color:var(--accent)}
  .node>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 11px;background:transparent}
  .node>summary::-webkit-details-marker{display:none}
  .node>summary::before{content:"▸";color:var(--fg3);font-size:11px;width:10px;flex:0 0 10px;transition:transform .15s}
  .node[open]>summary::before{transform:rotate(90deg)}
  .node.kind-trigger{border-left:3px solid #5aa2ff}
  .node.kind-stage{border-left:3px solid #8f7bff}
  .node.kind-event{border-left:3px solid #e0b050}
  .node.kind-ui{border-left:3px solid #4bbf7a}
  .node.kind-fallback{border-left:3px solid #b07fe0}
  .node.kind-diag{border-left:3px solid #66c2c2}
  .node.kind-constraint{border-left:3px solid #e06c6c}
  .node.kind-module{border-left:3px solid #7b849a}
  .node.kind-field{border-left:3px solid #b8a15a}
  .node.kind-test{border-left:3px solid #4c9c6a}
  .node.kind-file{border-left:3px solid #7b849a}
  .node.kind-dir{border-left:3px solid #9aa4bc}
  .badge{flex:0 0 auto;font-size:10.5px;letter-spacing:.3px;padding:1px 6px;border-radius:5px;
    border:1px solid var(--line);color:var(--fg3);background:var(--panel2);white-space:nowrap}
  .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .title code{font-size:12px;color:var(--fg2)}
  .hint{color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .warn-chip{font-size:10.5px;color:var(--warn);border:1px dashed var(--warn);border-radius:5px;padding:0 5px;white-space:nowrap}
  .body{padding:2px 13px 12px;border-top:1px solid var(--line2)}
  .body p{margin:8px 0;color:var(--fg2);max-width:72ch}
  .facts{margin:8px 0 0;padding-left:18px;color:var(--fg2)}
  .facts li{margin:3px 0}
  .codeblock{margin:10px 0 2px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--code)}
  .codehead{display:flex;align-items:center;gap:8px;padding:5px 9px;border-bottom:1px solid var(--line2);font-size:11.5px;color:var(--fg2)}
  .codehead .path{font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .codehead .lines{color:var(--fg3);white-space:nowrap}
  .codehead button{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--fg3);
    font:inherit;font-size:11px;padding:1px 7px;cursor:pointer}
  .codeblock pre{margin:0;padding:9px 11px;overflow:auto;font-size:12.2px;line-height:1.55;color:var(--fg)}
  .refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .ref{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--accent);
    font:inherit;font-size:11.5px;padding:2px 8px;cursor:pointer}
  .ref:hover{border-color:var(--accent)}
  .more{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 4px}
  .more .ref{color:var(--fg2)}
  .acts{display:flex;gap:6px;margin-top:8px}
  .hidden{display:none}
  .hit>.node{border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,168,254,.18)}
  .flash>.node{animation:flash 1.2s ease-out 1}
  @keyframes flash{0%{box-shadow:0 0 0 3px rgba(110,168,254,.55)}100%{box-shadow:0 0 0 0 rgba(110,168,254,0)}}

  /* ── 抽屉 ───────────────────────────────────────── */
  #drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,94vw);background:var(--panel);
    border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .18s ease;
    overflow:auto;z-index:50;padding:18px 18px 40px}
  #drawer.open{transform:none}
  #drawer h2{margin:0 0 6px;font-size:16px}
  #drawer .close{position:absolute;top:12px;right:14px;background:transparent;border:1px solid var(--line);
    border-radius:8px;color:var(--fg3);width:28px;height:28px;cursor:pointer}
  #drawer .meta{color:var(--fg3);font-size:12px;margin:0 0 10px}
  #drawer .body{padding:0;border-top:0}

  footer{max-width:1120px;margin:0 auto;padding:0 24px 50px;color:var(--fg3);font-size:12px}
  footer code{color:var(--fg2)}
  .k-trigger{color:#5aa2ff} .k-stage{color:#8f7bff} .k-event{color:#e0b050} .k-ui{color:#4bbf7a}
  .k-module,.k-file{color:#9aa4bc} .k-field{color:#b8a15a} .k-fallback{color:#b07fe0}
  .k-diag{color:#66c2c2} .k-constraint{color:#e06c6c} .k-test{color:#4c9c6a} .k-dir{color:#9aa4bc}

  /* ── 实物演示 ───────────────────────────────────── */
  .demo{margin:10px 0 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px}
  .demo .cap{font-size:11px;color:var(--fg3);margin-bottom:7px;letter-spacing:.3px}
  .demo-card{border:1px solid var(--line2);border-radius:10px;background:var(--panel);overflow:hidden}
  .demo-head{display:flex;align-items:center;gap:7px;width:100%;padding:6px 10px;border:0;background:transparent;
    color:inherit;font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
  .demo-head .ic{font-size:11px;color:var(--accent)}
  .demo-head .n{color:var(--fg3);font-size:11.5px}
  .demo-head .caret{margin-left:auto;color:var(--fg3);font-size:10px}
  .demo-body{padding:0 10px 10px;border-top:1px solid var(--line2)}
  .demo-body pre{margin:8px 0 0;white-space:pre-wrap;font-size:12.4px;line-height:1.65;color:var(--fg2);max-height:190px;overflow:auto}
  .demo-note{font-size:11px;color:var(--fg3);margin-top:7px}
  .payload{margin:0;padding:10px 11px;background:var(--code);border:1px solid var(--line);border-radius:9px;
    font-size:12.3px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
  .payload .key{background:transparent;border:0;border-bottom:1px dashed var(--accent);color:var(--accent);
    font:inherit;padding:0;cursor:pointer}
  .wire{margin:0;padding:10px 11px;background:var(--code);border:1px solid var(--line);border-radius:9px;
    font-size:12.1px;white-space:pre-wrap;word-break:break-all;color:var(--fg2)}
  .wire .ok{color:var(--ok)}
  mark{background:rgba(224,176,80,.28);color:inherit;border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>DSH 仲裁者插件 · 它是怎么运作的</h1>
  <p class="sub">一眼看流程，点开看细节。每个节点都能展开；带 <span class="badge">▣</span> 的节点里放着实物（真实 payload、可点开的卡片、真实诊断记录）。右栏抽屉是“再深一层”——树里最多嵌三层，再往里点就进抽屉。</p>
  <div class="chips" id="metaChips"></div>
  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-flow" aria-selected="true">运行流程</button>
      <button role="tab" id="tab-tree" aria-selected="false">仓库结构</button>
    </div>
    <input type="search" id="q" placeholder="搜：卡片 / interpret / po06/injection / 4000 …">
    <button class="btn" id="expandAll">全部展开</button>
    <button class="btn" id="collapseAll">全部折叠</button>
  </div>
  <div class="legend" id="legend"></div>
</header>

<main>
  <div class="intro" id="intro"></div>
  <div class="pipe" id="pipeline"></div>
  <div id="tree"></div>
</main>

<aside id="drawer" aria-hidden="true">
  <button class="close" id="drawerClose" title="关闭（Esc）">×</button>
  <h2 id="drawerTitle"></h2>
  <p class="meta" id="drawerMeta"></p>
  <div class="body" id="drawerBody"></div>
</aside>

<footer>
  <p>这页是静态快照：<code id="footMeta"></code>。代码改了记得重新生成，否则图和代码会分叉。</p>
  <p>自检命令：<code>node po06/test/how-it-works.test.mjs</code>（校验节点引用与文件路径都还存在）。</p>
</footer>

<script>
(function () {
  "use strict";
  const KINDS = {
    trigger: "触发", stage: "阶段", event: "事件", field: "字段", module: "模块",
    file: "文件", dir: "目录", ui: "界面", fallback: "降级", diag: "诊断",
    constraint: "约束", test: "验证"
  };
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const badge = (kind) => {
    const b = el("span", "badge k-" + kind, KINDS[kind] || kind);
    b.title = KINDS[kind] || kind;
    return b;
  };

  const INDEX = new Map();   // id -> { node, view, parent, depth }
  function indexView(viewKey, node, parent, depth) {
    INDEX.set(node.id, { node, view: viewKey, parent, depth });
    (node.children || []).forEach((c) => indexView(viewKey, c, node, depth + 1));
  }
  Object.keys(GRAPH.views).forEach((v) => indexView(v, GRAPH.views[v].root, null, 0));

  const state = { view: "flow", query: "", open: new Set(), drawer: null, silentHash: false, seeded: {} };

  // 首屏展开策略（每个视图只做一次）：流程展开第一层，结构只展开第一项
  function seedOpen(view) {
    if (state.seeded[state.view]) return;
    state.seeded[state.view] = true;
    const kids = view.root.children || [];
    // 打开所有节点会把 22 条正文一次铺满；首屏只展开前两步，其余留折叠（点一下就有）
    if (state.view === "flow") kids.slice(0, 2).forEach((n) => state.open.add(n.id));
    else if (kids[0]) state.open.add(kids[0].id);
  }

  /* ── 头部 ───────────────────────────────────── */
  const m = GRAPH.meta;
  const chips = document.getElementById("metaChips");
  [
    ["版本", m.version], ["代码基线", m.commit], ["日期", m.date],
    ["套件", m.suites + " 个"], ["断言", m.assertions + " 条"]
  ].forEach(([k, v]) => {
    const c = el("span", "chip"); c.appendChild(document.createTextNode(k + " "));
    const b = el("b", null, v); c.appendChild(b); chips.appendChild(c);
  });
  document.getElementById("footMeta").textContent =
    m.name + " · " + m.version + " · " + m.commit + " · " + m.date;

  const legend = document.getElementById("legend");
  Object.keys(KINDS).forEach((k) => {
    const s = el("span"); s.appendChild(badge(k)); s.appendChild(document.createTextNode(KINDS[k]));
    legend.appendChild(s);
  });

  /* ── 渲染树 ─────────────────────────────────── */
  const panel = document.getElementById("tree");
  const intro = document.getElementById("intro");

  function hitIn(node) {
    const q = state.query;
    if (!q) return true;
    const hay = [node.title, node.summary, (node.facts || []).join(" ")].join(" ").toLowerCase();
    return hay.includes(q);
  }
  function subtreeHit(node) {
    if (hitIn(node)) return true;
    return (node.children || []).some(subtreeHit);
  }

  function codeBlock(code) {
    const wrap = el("div", "codeblock");
    const head = el("div", "codehead");
    head.appendChild(el("span", "path", code.path));
    head.appendChild(el("span", "lines", code.lines ? "L" + code.lines[0] + "–" + code.lines[1] : ""));
    const copy = el("button", null, "复制路径");
    copy.onclick = () => {
      const text = code.path + (code.lines ? ":" + code.lines[0] : "");
      const done = () => { copy.textContent = "已复制"; setTimeout(() => { copy.textContent = "复制路径"; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
      else {
        const ta = el("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        ta.remove(); done();
      }
    };
    head.appendChild(copy);
    wrap.appendChild(head);
    if (code.text && code.text.length) {
      const pre = el("pre");
      pre.textContent = code.text.join("\n");
      wrap.appendChild(pre);
    }
    return wrap;
  }

  function facts(node) {
    if (!node.facts || !node.facts.length) return null;
    const ul = el("ul", "facts");
    node.facts.forEach((f) => {
      const li = el("li");
      li.innerHTML = f.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      ul.appendChild(li);
    });
    return ul;
  }

  function refRow(node) {
    if (!node.refs || !node.refs.length) return null;
    const row = el("div", "refs");
    node.refs.forEach((id) => {
      const rec = INDEX.get(id);
      if (!rec) return;
      const b = el("button", "ref", "→ " + rec.node.title);
      b.title = "跳到 " + id;
      b.onclick = (e) => { e.preventDefault(); jumpTo(id); };
      row.appendChild(b);
    });
    return row;
  }

  /* ── 实物：payload / 卡片 / 诊断 ─────────────── */
  function widget(kind) {
    if (kind === "payload") return payloadWidget();
    if (kind === "card") return cardWidget();
    if (kind === "wire") return wireWidget();
    return null;
  }

  function payloadWidget() {
    const d = el("div", "demo");
    d.appendChild(el("div", "cap", "实物 · 插件内存里这条记录的形状（键可点，跳到字段说明）"));
    const pre = el("pre", "payload");
    const k = (name, target) => {
      const b = el("button", "key", name);
      b.onclick = () => jumpTo(target);
      return b;
    };
    pre.appendChild(document.createTextNode("{\n  "));
    pre.appendChild(k("anchorSeq", "flow.field-anchor")); pre.appendChild(document.createTextNode(": 1821,\n  "));
    pre.appendChild(k("chars", "flow.field-chars")); pre.appendChild(document.createTextNode(": 3493,\n  "));
    pre.appendChild(k("injected", "flow.field-injected")); pre.appendChild(document.createTextNode(": \"（注入文本体，最多 4000 字）…\",\n  "));
    pre.appendChild(k("truncated", "flow.field-truncated")); pre.appendChild(document.createTextNode(": false\n}"));
    d.appendChild(pre);
    return d;
  }

  function cardWidget() {
    const d = el("div", "demo");
    d.appendChild(el("div", "cap", "实物 · 卡片复刻（点一下展开）"));
    const card = el("div", "demo-card");
    const head = el("button", "demo-head");
    head.appendChild(el("span", "ic", "▣"));
    head.appendChild(el("span", null, "本次注入"));
    head.appendChild(el("span", "n", "· 3493 字"));
    const caret = el("span", "caret", "▾");
    head.appendChild(caret);
    const body = el("div", "demo-body");
    body.hidden = true;
    const pre = el("pre");
    pre.textContent = "【本轮注入】\n你要做的是：一个单文件黑洞可视化…\n验收口径：能预览、能操控、物理近似正确…\n\n（以下是顾问流程契约与工作流程说明，模型每次请求都会读到）\n…";
    body.appendChild(pre);
    body.appendChild(el("div", "demo-note", "超过 4000 字时，这里只显示前 4000 字，并多一行说明。"));
    head.onclick = () => { body.hidden = !body.hidden; caret.textContent = body.hidden ? "▾" : "▴"; };
    card.appendChild(head); card.appendChild(body);
    d.appendChild(card);
    return d;
  }

  function wireWidget() {
    const d = el("div", "demo");
    d.appendChild(el("div", "cap", "实物 · po06-wire.jsonl 里的一条记录"));
    const pre = el("pre", "wire");
    pre.appendChild(document.createTextNode('{"at":"2026-10-18T14:13:30.279Z","sessionId":"session-…","trigger":"'));
    const t = el("span", "ok", "inject-card"); pre.appendChild(t);
    pre.appendChild(document.createTextNode('","ok":true,"chars":3493,"anchorSeq":1821}'));
    d.appendChild(pre);
    d.appendChild(el("div", "demo-note", "失败时同一个 trigger 会是 ok:false + reason（例如 session append cannot reenter）。"));
    return d;
  }

  function renderNode(viewKey, node, depth) {
    const li = el("li");
    li.dataset.id = node.id;
    li.__node = node;

    const det = el("details", "node kind-" + node.kind);
    det.open = state.open.has(node.id) || (state.query !== "" && subtreeHit(node));
    det.addEventListener("toggle", () => {
      if (det.open) state.open.add(node.id); else state.open.delete(node.id);
    });

    const sum = el("summary");
    sum.appendChild(badge(node.kind));
    const title = el("span", "title", node.title);
    title.title = node.title;
    sum.appendChild(title);
    if (node.summary) {
      const hint = el("span", "hint", node.summary);
      hint.title = node.summary;
      sum.appendChild(hint);
    }
    det.appendChild(sum);

    const body = el("div", "body");
    if (node.summary) body.appendChild(el("p", null, node.summary));
    if (node.code) body.appendChild(codeBlock(node.code));
    const f = facts(node); if (f) body.appendChild(f);
    const w = node.widget ? widget(node.widget) : null; if (w) body.appendChild(w);
    const rr = refRow(node); if (rr) body.appendChild(rr);
    det.appendChild(body);

    li.appendChild(det);

    const kids = node.children || [];
    if (kids.length && depth < 3) {
      const ul = el("ul", "tree");
      kids.forEach((c) => ul.appendChild(renderNode(viewKey, c, depth + 1)));
      det.appendChild(ul);
    } else if (kids.length) {
      const more = el("div", "more");
      kids.forEach((c) => {
        const b = el("button", "ref", (KINDS[c.kind] || c.kind) + " · " + c.title);
        b.onclick = () => jumpTo(c.id);
        more.appendChild(b);
      });
      det.appendChild(more);
    }
    return li;
  }

  const PIPE = [
    ["flow.trigger", "① 发送"], ["flow.interpret", "② 解释"], ["flow.render", "③ 组装"],
    ["flow.review", "④ 审查"], ["flow.release", "⑤ 放行"], ["flow.inject", "⑥ 注入"],
    ["flow.event", "⑦ 记录"], ["flow.card", "⑧ 卡片"]
  ];
  function renderPipe() {
    const host = document.getElementById("pipeline");
    host.innerHTML = "";
    if (state.view !== "flow") { host.hidden = true; return; }
    host.hidden = false;
    PIPE.forEach(([id, label], i) => {
      if (i) host.appendChild(el("span", "arrow", "→"));
      const b = el("button", "step", label);
      b.title = "跳到 " + id;
      b.onclick = () => jumpTo(id);
      host.appendChild(b);
    });
  }

  function render() {
    const view = GRAPH.views[state.view];
    intro.innerHTML = view.intro;
    seedOpen(view);
    renderPipe();
    panel.innerHTML = "";
    const ul = el("ul", "tree");
    (view.root.children || []).forEach((n) => ul.appendChild(renderNode(state.view, n, 1)));
    panel.appendChild(ul);
    applyFilter();
    document.getElementById("tab-flow").setAttribute("aria-selected", String(state.view === "flow"));
    document.getElementById("tab-tree").setAttribute("aria-selected", String(state.view === "tree"));
  }

  function applyFilter() {
    const q = state.query;
    const nodes = panel.querySelectorAll("li[data-id]");
    nodes.forEach((li) => {
      const node = li.__node;
      if (!q) { li.classList.remove("hidden"); li.classList.remove("hit"); return; }
      const self = hitIn(node);
      const any = subtreeHit(node);
      li.classList.toggle("hidden", !any);
      li.classList.toggle("hit", self);
      if (any) li.querySelectorAll(":scope > details").forEach((d) => { d.open = true; });
    });
  }

  /* ── 跳转 / 抽屉 ────────────────────────────── */
  function ancestors(id) {
    const out = [];
    let rec = INDEX.get(id);
    while (rec && rec.parent) { out.push(rec.parent.id); rec = INDEX.get(rec.parent.id); }
    return out;
  }

  function locate(id) {
    const rec = INDEX.get(id);
    if (!rec) return false;
    if (rec.view !== state.view) switchView(rec.view, true);
    ancestors(id).forEach((a) => state.open.add(a));
    state.open.add(id);
    render();
    const li = panel.querySelector('li[data-id="' + id + '"]');
    if (li) {
      const det = li.querySelector(":scope > details");
      if (det) det.open = true;
      li.scrollIntoView({ block: "center", behavior: "smooth" });
      li.classList.add("flash");
      setTimeout(() => li.classList.remove("flash"), 1300);
    }
    return true;
  }

  function jumpTo(id) {
    state.silentHash = true;
    const rec = INDEX.get(id);
    if (rec) location.hash = "#/" + rec.view + "/" + id;
    state.silentHash = false;
    locate(id);
    showDrawer(id);
  }

  function switchView(v, keepHash) {
    state.view = v;
    state.query = "";
    const q = document.getElementById("q"); if (q) q.value = "";
    render();
    if (!keepHash) {
      state.silentHash = true;
      location.hash = "#/" + v;
      state.silentHash = false;
    }
  }

  const drawer = document.getElementById("drawer");
  function showDrawer(id) {
    const rec = INDEX.get(id);
    if (!rec) return;
    const n = rec.node;
    state.drawer = id;
    drawer.querySelector("#drawerTitle").textContent = n.title;
    const meta = drawer.querySelector("#drawerMeta");
    meta.textContent = (KINDS[n.kind] || n.kind) + " · " + n.id;
    const body = drawer.querySelector("#drawerBody");
    body.innerHTML = "";
    if (n.summary) body.appendChild(el("p", null, n.summary));
    const f = facts(n); if (f) body.appendChild(f);
    if (n.code) body.appendChild(codeBlock(n.code));
    const w = n.widget ? widget(n.widget) : null; if (w) body.appendChild(w);
    const rr = refRow(n); if (rr) body.appendChild(rr);
    if (n.children && n.children.length) {
      const h = el("p", null, "下一层：");
      body.appendChild(h);
      const row = el("div", "refs");
      n.children.forEach((c) => {
        const b = el("button", "ref", (KINDS[c.kind] || c.kind) + " · " + c.title);
        b.onclick = () => jumpTo(c.id);
        row.appendChild(b);
      });
      body.appendChild(row);
    }
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
  }
  function closeDrawer() {
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    state.drawer = null;
  }
  document.getElementById("drawerClose").onclick = closeDrawer;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  /* ── 搜索 / 工具 / 路由 ─────────────────────── */
  document.getElementById("q").addEventListener("input", (e) => {
    state.query = String(e.target.value || "").trim().toLowerCase();
    render();
  });
  document.getElementById("expandAll").onclick = () => {
    INDEX.forEach((rec, id) => { if (rec.view === state.view) state.open.add(id); });
    render();
  };
  document.getElementById("collapseAll").onclick = () => {
    state.open.clear();
    render();
  };
  document.getElementById("tab-flow").onclick = () => switchView("flow");
  document.getElementById("tab-tree").onclick = () => switchView("tree");

  function onHash() {
    if (state.silentHash) return;
    const h = location.hash || "";
    const m2 = /^#\/(flow|tree)(?:\/([A-Za-z0-9._-]+))?$/.exec(h);
    if (!m2) return;
    const view = m2[1], id = m2[2];
    if (view !== state.view) switchView(view, true);
    if (id) { locate(id); showDrawer(id); }
  }
  window.addEventListener("hashchange", onHash);

  render();
  onHash();
})();
</script>
</body>
</html>
